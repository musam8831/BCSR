name: governance-checks
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema cryptography
      - run: python scripts/check_repo.py
      - name: Unit tests (catalogue validator, docs check)
        run: python -m unittest discover -s tests -v
      - name: Docs links and traceability IDs
        run: python scripts/check_docs.py
      - name: PR must reference a task ID
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$TITLE $BODY" | grep -Eq 'T-M[0-9]+-[0-9]{3}' || { echo "No task ID (T-Mx-NNN) found"; exit 1; }
      - name: PR must complete the Definition of Done
        # drafts may carry open items; the check runs when the PR is marked ready
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check_pr_dod.sh
      - name: Catalogue bundle builds from the current catalogue (T-M4-007)
        run: python scripts/build_catalogue_bundle.py --version ci --out build/catalogue
      - name: ML feature tests (FS-001)
        run: python -m unittest discover -s ml/features -v
      - name: main commits must come from a merged PR (D-008 audit)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.merged_at != null)] | length')
          [ "$n" -gt 0 ] || { echo "::error::${{ github.sha }} reached main without a merged PR (AGENTS.md §5.6, D-008)"; exit 1; }
  # Pilot P5 (AG-15): Kotlin unit tests for the product modules and the spike app.
  kotlin-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate committed Gradle wrapper jars
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Product build — all module tests, debug APK, SBOM (T-M5-015)
        working-directory: app/android
        run: bash ./gradlew --no-daemon test :app:assembleDebug cyclonedxBom
      - name: Privacy and safety gates on the merged manifest (T-M5-013)
        run: python3 scripts/check_android_gates.py --merged app/android/app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml
      - name: Keep the SBOM with the run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: app/android/build/reports/bom.json
      - name: Spike app unit tests (uses the runner's Android SDK)
        working-directory: app/android/spikes
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest
