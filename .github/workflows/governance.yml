name: governance-checks
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python scripts/check_repo.py
      - name: Unit tests (catalogue validator, docs check)
        run: python -m unittest discover -s tests -v
      - name: Docs links and traceability IDs
        run: python scripts/check_docs.py
      - name: PR must reference a task ID
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$TITLE $BODY" | grep -Eq 'T-M[0-9]+-[0-9]{3}' || { echo "No task ID (T-Mx-NNN) found"; exit 1; }
      - name: PR must complete the Definition of Done
        # drafts may carry open items; the check runs when the PR is marked ready
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check_pr_dod.sh
      - name: main commits must come from a merged PR (D-008 audit)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.merged_at != null)] | length')
          [ "$n" -gt 0 ] || { echo "::error::${{ github.sha }} reached main without a merged PR (AGENTS.md §5.6, D-008)"; exit 1; }
