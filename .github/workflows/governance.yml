name: governance-checks
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python scripts/check_repo.py
      - name: PR must reference a task ID
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$TITLE $BODY" | grep -Eq 'T-M[0-9]+-[0-9]{3}' || { echo "No task ID (T-Mx-NNN) found"; exit 1; }
      - name: PR must complete the Definition of Done
        # drafts may carry open items; the check runs when the PR is marked ready
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check_pr_dod.sh
